[package]
name = "yaanaiapp"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
bytesize = "1.3.0"
tokio = { version = "1.0", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
glob = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
trash = "5"
rayon = "1.7"

[lib]
name = "yaanaiapp"
path = "src/yaanaiapp.rs"
